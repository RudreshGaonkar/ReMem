<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Dark Modern Rounded Background -->
  <rect width="128" height="128" rx="28" fill="#0F172A"/>
  
  <!-- Outer Neural / Context Node Connections -->
  <g stroke="#38BDF8" stroke-width="2" stroke-opacity="0.4" fill="none">
    <line x1="64" y1="28" x2="36" y2="52" />
    <line x1="64" y1="28" x2="92" y2="52" />
    <line x1="36" y1="52" x2="44" y2="88" />
    <line x1="92" y1="52" x2="84" y2="88" />
    <line x1="44" y1="88" x2="84" y2="88" />
  </g>

  <!-- Node Dots (Memory Anchors) -->
  <circle cx="64" cy="28" r="4" fill="#38BDF8"/>
  <circle cx="36" cy="52" r="4" fill="#38BDF8"/>
  <circle cx="92" cy="52" r="4" fill="#38BDF8"/>
  <circle cx="44" cy="88" r="4" fill="#38BDF8"/>
  <circle cx="84" cy="88" r="4" fill="#38BDF8"/>

  <!-- Central Brain / Chip Micro-Memory Core -->
  <rect x="50" y="50" width="28" height="28" rx="6" fill="#1E293B" stroke="#818CF8" stroke-width="2.5"/>
  
  <!-- Glowing Circuit Lines inside Central Core -->
  <path d="M 58,64 L 70,64 M 64,58 L 64,70" stroke="#C084FC" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Lightning / Fast Token Optimization Symbol -->
  <path d="M 66,38 L 56,60 L 65,60 L 60,82 L 74,58 L 65,58 Z" fill="#F59E0B" opacity="0.9"/>
</svg>
